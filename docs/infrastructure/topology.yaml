# Source of truth for home network topology.
# Regenerate docs:  python3 scripts/render-topology.py
# Outputs: topology.md (agents/humans) + topology.html (scan page)

meta:
  title: Basehome network topology
  updated: "2026-09-08"
  description: >
    Proxmox host, Kubuntu guest, Docker services, Tailscale, Cloudflare Tunnel
    (Immich only), and wdred NFS. Edit topology.yaml, then re-run the renderer —
    do not hand-edit generated MD/HTML.

lan:
  subnet: 192.168.11.0/24
  gateway: 192.168.11.1
  gateway_label: ISP router

dns:
  domain: maktaba.home
  mode: Tailscale split DNS
  nameserver: 100.68.38.53
  notes:
    - dnsmasq on maktaba binds LAN + Tailscale IP
    - All *.maktaba.home → 100.68.38.53
    - Router DHCP DNS to maktaba is optional; Tailscale is primary for owned devices

remote_access:
  default: >
    Tailscale mesh (no port-forward). Immich also public via Cloudflare Tunnel +
    Access at photos.homz.fyi — Vaultwarden stays Tailscale-only.
  not_exposed:
    - Jellyfin
    - TubeArchivist
    - Vaultwarden
    - Homepage
    - Forgejo
  see_also: docs/vaultwarden/remote-access.md

hosts:
  - id: pve
    name: Proxmox pve
    role: Hypervisor + USB NFS server
    status: live
    lan_ip: 192.168.11.123
    tailscale_ip: 100.91.123.54
    notes:
      - Only host that mounts the USB block device
      - Guests consume storage via NFS only

  - id: maktaba-vm
    name: Kubuntu maktaba VM
    role: Docker host for home services
    status: live
    lan_ip: 192.168.11.141
    tailscale_ip: 100.68.38.53
    parent: pve
    notes:
      - Exit node off (YouTube uses browser cookies in Redis)
      - VM root disk ~71G (configs, DBs, caches — not bulk media)

storage:
  - id: wdred
    name: USB WD Red (wdred)
    host: pve
    path: /mnt/pve/wdred
    size: ~3.7T
    status: live
    layout:
      - path: pve/
        purpose: Proxmox backups / ISO / vztmpl
        exported: false
      - path: maktaba/media/
        purpose: Jellyfin + TubeArchivist media
        exported: true
        nfs_export: /mnt/pve/wdred/maktaba/media
        mount_on: maktaba-vm
        mount_path: /srv/maktaba/data/media
        clients: ["192.168.11.141"]
        squash: "UID/GID 1000"
      - path: shared/
        purpose: Shared scratch for guests (+ Immich library for now)
        exported: true
        nfs_export: /mnt/pve/wdred/shared
        mount_on: maktaba-vm
        mount_path: /mnt/wdred/shared
        clients: ["192.168.11.141"]
        squash: "UID/GID 1000"
      - path: shared/immich/library/
        purpose: Immich upload library (photos/videos) — interim under shared
        exported: true
        nfs_export: /mnt/pve/wdred/shared
        mount_on: maktaba-vm
        mount_path: /srv/immich/library
        clients: ["192.168.11.141"]
        squash: "UID/GID 1000"
        status: live
      - path: immich/library/
        purpose: Immich upload library (dedicated export — optional later)
        exported: true
        nfs_export: /mnt/pve/wdred/immich/library
        mount_on: maktaba-vm
        mount_path: /srv/immich/library
        clients: ["192.168.11.141"]
        squash: "UID/GID 1000"
        status: planned

services:
  - id: jellyfin
    name: Jellyfin
    host: maktaba-vm
    status: live
    url: http://player.maktaba.home
    live_path: /srv/maktaba
    edge: maktaba-caddy (:80)
    notes: Media on NFS maktaba/media

  - id: tubearchivist
    name: TubeArchivist
    host: maktaba-vm
    status: live
    url: http://yt.maktaba.home
    live_path: /srv/maktaba
    edge: maktaba-caddy (:80)
    notes: YouTube archive; ES/Redis on VM disk

  - id: vaultwarden
    name: Vaultwarden
    host: maktaba-vm
    status: live
    url: https://vault.maktaba.home
    live_path: /srv/vaultwarden
    edge: vaultwarden-caddy (:443, tls internal)
    notes: Tailscale-only; daily SQLite backups

  - id: dnsmasq
    name: dnsmasq
    host: maktaba-vm
    status: live
    url: "*.maktaba.home"
    live_path: /etc/dnsmasq.d/maktaba.conf
    edge: —
    notes: Split-DNS nameserver for Tailscale

  - id: immich
    name: Immich
    host: maktaba-vm
    status: live
    url: https://photos.homz.fyi · https://photos.maktaba.home
    live_path: /srv/immich
    edge: Cloudflare Tunnel (public) + vaultwarden-caddy (admin)
    notes: >
      Public: photos.homz.fyi via tunnel maktaba-immich + Access (OTP / service
      token). Admin: photos.maktaba.home on Tailscale. Library on
      shared/immich/library (NFS); Postgres on VM disk. Cgroup memory limits
      (~6.25G). Vaultwarden not on this tunnel. See docs/immich/operations.md
      and docs/immich/public-access-runbook.md.

  - id: homepage
    name: Homepage
    host: maktaba-vm
    status: live
    url: https://home.maktaba.home
    live_path: /srv/homepage
    edge: vaultwarden-caddy (:443, tls internal)
    notes: >
      Start-page dashboard (gethomepage). Docker socket RO for tile status;
      search/datetime/resources widgets. See docs/homepage/operations.md.

  - id: forgejo
    name: Forgejo
    host: maktaba-vm
    status: planned
    url: https://git.maktaba.home
    live_path: /srv/forgejo
    edge: vaultwarden-caddy (:443, tls internal)
    notes: >
      Self-hosted Git forge. Postgres + repos on VM SSD; HTTPS git day one; no runner yet.
      See docs/forgejo/setup-plan.md.

edges:
  - id: maktaba-caddy
    name: maktaba-caddy
    binds: ":80"
    status: live
    sites:
      - host: player.maktaba.home
        backend: jellyfin:8096
      - host: yt.maktaba.home
        backend: tubearchivist:8000
      - host: docs.maktaba.home
        backend: file_server /srv/docs

  - id: vaultwarden-caddy
    name: vaultwarden-caddy
    binds: ":443"
    status: live
    tls: internal CA
    sites:
      - host: vault.maktaba.home
        backend: vaultwarden:80
        status: live
      - host: photos.maktaba.home
        backend: immich_server:2283
        status: live
      - host: home.maktaba.home
        backend: homepage:3000
        status: planned
      - host: git.maktaba.home
        backend: forgejo:3000
        status: planned

  - id: maktaba-immich-tunnel
    name: Cloudflare Tunnel (maktaba-immich)
    binds: cloudflared in Immich compose
    status: live
    tls: Cloudflare edge (Access on all paths)
    sites:
      - host: photos.homz.fyi
        backend: immich_server:2283
        status: live

invariants:
  - No new public-facing service without a REGISTRY row
  - Do not expose app ports on the ISP router; Tailscale first (Immich public path is Tunnel + Access only)
  - Immich tunnel must never publish Vaultwarden or other services — photos.homz.fyi only
  - Only Proxmox mounts the USB block device; guests use NFS
  - NFS exports restricted to 192.168.11.141 (not whole LAN)
  - Postgres / ES / Redis stay on VM disk — never on NFS
  - No secrets in basehome-ops git
